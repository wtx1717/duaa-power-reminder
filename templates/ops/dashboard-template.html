<!--
  看板 HTML 模板。

  这个模板既可以被 generate-dashboard-daily.js 生成成静态示例页面，
  也可以作为本地预览页面的基础结构。真实快照模式会通过
  scripts/dashboard-runtime.js 填充带有 id 的容器；文件底部的内嵌脚本
  则提供没有快照服务时仍可打开页面的离线示例数据。
-->
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>运维看板预览</title>
  <style>
    /* 颜色变量集中管理状态颜色和基础界面颜色，下面各组件通过 var(...) 复用。 */
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --text: #13201b;
      --muted: #65736d;
      --line: #e6ece8;
      --shadow: 0 1px 2px rgba(16, 24, 20, 0.03);
      --green: #1f7a5a;
      --green-bg: #eef8f2;
      --yellow: #b47914;
      --yellow-bg: #fff8e8;
      --blue: #2a69c7;
      --blue-bg: #eef4ff;
      --red: #b5452f;
      --red-bg: #fff1ed;
    }

    /* 全局基础规则：统一盒模型、隐藏状态和表单字体，减少浏览器默认差异。 */
    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    button,
    input,
    table {
      font: inherit;
    }

    /* 页面外壳、顶部信息区和内容区的宽度约束。 */
    .shell {
      min-height: 100vh;
    }

    .topbar {
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .topbar-inner,
    .content {
      width: min(1680px, calc(100% - 48px));
      margin: 0 auto;
    }

    .topbar-inner {
      padding: 18px 0 16px;
    }

    .brand-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
    }

    .brand h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .brand p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    /* 顶部更新时间、状态图例等小型信息标签。 */
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .meta-chip,
    .legend-item,
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }

    .meta-chip {
      padding: 7px 11px;
    }

    .legend-item.normal {
      color: var(--green);
      border-color: rgba(31, 122, 90, 0.22);
      background: rgba(31, 122, 90, 0.06);
    }

    .legend-item.warn {
      color: var(--yellow);
      border-color: rgba(180, 121, 20, 0.24);
      background: rgba(180, 121, 20, 0.06);
    }

    .legend-item.monitor {
      color: var(--blue);
      border-color: rgba(42, 105, 199, 0.24);
      background: rgba(42, 105, 199, 0.06);
    }

    .legend-item.error {
      color: var(--red);
      border-color: rgba(181, 69, 47, 0.26);
      background: rgba(181, 69, 47, 0.06);
    }

    /* KPI 网格：宽屏显示多列，后面的媒体查询会在较窄屏幕减少列数。 */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 12px;
    }

    .kpi {
      min-height: 94px;
      padding: 14px 14px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .kpi-label {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .kpi-value {
      margin-top: 10px;
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0;
    }

    .kpi-foot {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    /* 主内容按“状态摘要、 电表卡片、 通知表格”纵向排列。 */
    .content {
      padding: 18px 0 40px;
      display: grid;
      gap: 18px;
    }

    .section {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 18px 14px;
      border-bottom: 1px solid rgba(219, 228, 223, 0.84);
      background: #fff;
    }

    .section-title h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .section-title p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    /* 区块标题右侧的图例和其他操作控件。 */
    .section-tools {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .legend-item {
      padding: 7px 11px;
    }

    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    /* 状态摘要卡片及其顶部状态色条。 */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 18px;
    }

    .summary-card {
      min-height: 102px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .summary-card h3 {
      margin: 0;
      font-size: 13px;
      line-height: 1.4;
      color: var(--muted);
      font-weight: 500;
    }

    .summary-card .count {
      margin-top: 10px;
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
    }

    .summary-card .note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .summary-card::before,
    .meter-card::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 3px;
      background: var(--accent, var(--line));
    }

    .summary-card.normal,
    .meter-card.normal {
      --accent: var(--green);
    }

    .summary-card.warn,
    .meter-card.warn {
      --accent: var(--yellow);
    }

    .summary-card.monitor,
    .meter-card.monitor {
      --accent: var(--blue);
    }

    .summary-card.error,
    .meter-card.error {
      --accent: var(--red);
    }

    .summary-card.normal .count,
    .summary-card.warn .count,
    .summary-card.monitor .count,
    .summary-card.error .count {
      color: var(--accent);
    }

    /* 电表总览：上方是密集状态矩阵，下方是可翻页的电表卡片。 */
    .section-body {
      padding: 18px;
    }

    .meter-panel {
      display: grid;
      gap: 18px;
    }

    .meter-overview {
      display: block;
    }

    .meter-matrix {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
    }

    .meter-tile {
      width: 18px;
      height: 18px;
      border: 1px solid rgba(16, 24, 20, 0.06);
      border-radius: 4px;
      background: #f4f6f5;
      padding: 0;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.24);
      cursor: default;
    }

    .meter-tile.normal {
      background: #d9ecdf;
    }

    .meter-tile.warn {
      background: #f3ddbb;
    }

    .meter-tile.monitor {
      background: #d4dff0;
    }

    .meter-tile.error {
      background: #efc4b8;
    }

    /* 电表卡片分页工具栏和卡片网格。 */
    .detail-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .detail-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .pager-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .pager-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }

    .pager-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .pager-btn:not(:disabled):hover {
      border-color: rgba(31, 122, 90, 0.28);
      color: var(--green);
    }

    .meter-table-wrap {
      margin-top: 6px;
    }

    .meter-table {
      min-width: 920px;
    }

    .meter-table .state-cell {
      width: 92px;
    }

    .meter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(176px, 1fr));
      gap: 10px;
    }

    .meter-card {
      min-height: 148px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .meter-card:hover,
    .meter-card:focus-visible {
      border-color: rgba(31, 122, 90, 0.36);
      box-shadow: 0 4px 12px rgba(16, 24, 20, 0.08);
      outline: none;
    }

    .meter-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .meter-head-badges {
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 6px;
      max-width: 58%;
    }

    .meter-id {
      font-size: 20px;
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: 0;
    }

    .meter-type {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      margin-top: 6px;
    }

    .status-pill {
      padding: 6px 9px;
      white-space: nowrap;
    }

    .cold-start-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 9px;
      border: 1px solid rgba(42, 105, 199, 0.26);
      border-radius: 999px;
      background: rgba(42, 105, 199, 0.08);
      color: var(--blue);
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
    }

    .status-pill.normal {
      color: var(--green);
      border-color: rgba(31, 122, 90, 0.22);
      background: rgba(31, 122, 90, 0.06);
    }

    .status-pill.warn {
      color: var(--yellow);
      border-color: rgba(180, 121, 20, 0.24);
      background: rgba(180, 121, 20, 0.06);
    }

    .status-pill.monitor {
      color: var(--blue);
      border-color: rgba(42, 105, 199, 0.24);
      background: rgba(42, 105, 199, 0.06);
    }

    .status-pill.error {
      color: var(--red);
      border-color: rgba(181, 69, 47, 0.26);
      background: rgba(181, 69, 47, 0.06);
    }

    .meter-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 10px;
      margin-top: auto;
    }

    .stat {
      padding-top: 8px;
      border-top: 1px solid rgba(219, 228, 223, 0.8);
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .stat-value {
      margin-top: 5px;
      font-size: 13px;
      line-height: 1.45;
      font-weight: 600;
    }

    /* 表格容器允许横向滚动，保证窄屏不会把列内容挤到不可读。 */
    .table-wrap {
      overflow-x: auto;
      background: #fff;
    }

    table {
      width: 100%;
      min-width: 920px;
      border-collapse: separate;
      border-spacing: 0;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 14px 16px;
      text-align: left;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
      background: #f8faf9;
      border-bottom: 1px solid var(--line);
    }

    tbody td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(219, 228, 223, 0.7);
      font-size: 13px;
      line-height: 1.45;
      vertical-align: top;
    }

    tbody tr:hover {
      background: rgba(31, 122, 90, 0.03);
    }

    .table-time {
      white-space: nowrap;
      color: var(--muted);
    }

    .table-meter {
      font-weight: 600;
    }

    .table-main {
      font-weight: 600;
    }

    .table-sub {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .table-message {
      color: var(--muted);
    }

    /* 电表详情弹窗：遮罩铺满视口，内部内容限制最大高度并独立滚动。 */
    .meter-detail-mask {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(15, 23, 19, 0.45);
    }

    .meter-detail {
      width: min(980px, 100%);
      max-height: min(88vh, 840px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 20px 60px rgba(16, 24, 20, 0.22);
    }

    .meter-detail-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }

    .meter-detail-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
    }

    .meter-detail-subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .meter-detail-close {
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }

    .meter-detail-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfb;
    }

    .meter-detail-summary-item {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }

    .meter-detail-summary-label,
    .meter-detail-record-label {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .meter-detail-summary-value {
      margin-top: 5px;
      overflow-wrap: anywhere;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
    }

    .meter-detail-tabs {
      display: flex;
      gap: 8px;
      padding: 14px 18px 0;
      border-bottom: 1px solid var(--line);
    }

    .meter-detail-tab {
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-bottom: 0;
      border-radius: 6px 6px 0 0;
      background: #f8faf8;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
    }

    .meter-detail-tab.active {
      margin-bottom: -1px;
      background: #fff;
      color: var(--text);
      font-weight: 600;
    }

    .meter-detail-body {
      max-height: 52vh;
      overflow-y: auto;
      padding: 18px;
    }

    .meter-detail-record-list {
      display: grid;
      gap: 10px;
    }

    .meter-detail-record {
      display: grid;
      grid-template-columns: 170px 120px 100px minmax(0, 1fr);
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }

    .meter-detail-record.failed {
      border-color: rgba(181, 69, 47, 0.22);
      background: var(--red-bg);
    }

    .meter-detail-record-value {
      margin-top: 4px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
    }

    .meter-detail-record-note {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .meter-detail-empty {
      padding: 28px 12px;
      border: 1px dashed var(--line);
      border-radius: 6px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    /* 弹窗在平板和手机宽度下改为更少的列，保证摘要和记录不溢出。 */
    @media (max-width: 720px) {
      .meter-detail-summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .meter-detail-record {
        grid-template-columns: 1fr 1fr;
      }
    }

    /* 最窄屏幕使用单列记录，并缩小弹窗内边距。 */
    @media (max-width: 480px) {
      .meter-detail-mask {
        padding: 10px;
      }

      .meter-detail-summary,
      .meter-detail-body,
      .meter-detail-head,
      .meter-detail-tabs {
        padding-left: 12px;
        padding-right: 12px;
      }

      .meter-detail-record {
        grid-template-columns: 1fr;
      }
    }

    /* 通知和任务状态标签的颜色。 */
    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 70px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
    }

    .tag.sent {
      color: var(--green);
      background: rgba(31, 122, 90, 0.08);
    }

    .tag.failed {
      color: var(--red);
      background: rgba(181, 69, 47, 0.08);
    }

    .tag.pending {
      color: var(--yellow);
      background: rgba(180, 121, 20, 0.08);
    }

    .tag.skipped {
      color: var(--blue);
      background: rgba(42, 105, 199, 0.08);
    }

    /* 宽度断点：逐步降低 KPI 和状态摘要的列数。 */
    @media (max-width: 1480px) {
      .kpi-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    /* 中等屏幕把标题和右侧信息改为纵向排列。 */
    @media (max-width: 920px) {
      .topbar-inner,
      .content {
        width: min(100% - 24px, 1680px);
      }

      .brand-row {
        flex-direction: column;
      }

      .meta-row {
        width: 100%;
        justify-content: flex-start;
      }

      .kpi-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }
    }

    /* 手机屏幕使用更窄的外边距和单列电表卡片。 */
    @media (max-width: 640px) {
      .topbar-inner,
      .content {
        width: min(100% - 18px, 1680px);
      }

      .topbar-inner {
        padding-top: 14px;
      }

      .brand h1 {
        font-size: 24px;
      }

      .meta-row {
        width: 100%;
        min-width: 0;
        justify-content: flex-start;
        align-items: flex-start;
      }

      .meta-chip {
        min-width: 0;
        max-width: 100%;
        white-space: normal;
        overflow-wrap: anywhere;
        line-height: 1.35;
      }

      .kpi-grid {
        grid-template-columns: 1fr;
      }

      .section-head,
      .section-body {
        padding-left: 14px;
        padding-right: 14px;
      }

      .section-head {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .section-tools,
      .legend {
        width: 100%;
        justify-content: flex-start;
      }

      .summary-grid {
        padding-left: 14px;
        padding-right: 14px;
      }

      .meter-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- 页面最外层容器；顶部栏固定包含品牌和 KPI，主体承载各业务区块。 -->
  <div class="shell">
    <!-- 顶部概览区：更新时间是模板示例值，真实数据由运行时脚本更新。 -->
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-row">
          <div class="brand">
            <h1>宿舍电量运维看板</h1>
          </div>

    </header>

    <!-- 主体区块按运营人员的阅读顺序排列。 -->
    <main class="content">
      <!-- 状态摘要：展示四类电表状态的数量和含义。 -->
      <section class="section">
        <div class="section-head">
          <div class="section-title">
            <h2>电表状态总览</h2>
          </div>
          <div class="section-tools">
            <div class="legend">
              <span class="legend-item normal"><span class="swatch" style="background: currentColor;"></span>正常</span>
              <span class="legend-item warn"><span class="swatch" style="background: currentColor;"></span>预警</span>
              <span class="legend-item monitor"><span class="swatch" style="background: currentColor;"></span>待检查</span>

          </div>
        </div>
        <div class="summary-grid" id="summaryGrid"></div>
      </section>

      <!-- 电表区：矩阵用于快速扫视，卡片用于查看单台电表详情。 -->
      <section class="section">
        <div class="section-head">
          <div class="section-title">
            <h2>电表栏目区</h2>
          </div>
          <div class="section-tools">
            <div class="legend">
              <span class="legend-item normal"><span class="swatch" style="background: currentColor;"></span>正常</span>
              <span class="legend-item warn"><span class="swatch" style="background: currentColor;"></span>预警</span>
              <span class="legend-item monitor"><span class="swatch" style="background: currentColor;"></span>待检查</span>

      <!-- 通知明细表：运行时根据当前快照的 notificationRecords 填充表格行。 -->

          <div class="section-title">
            <h2>邮件通知明细</h2>

          <div class="table-wrap">

  <!--
    电表详情弹窗默认 hidden。
    点击电表卡片后脚本移除 hidden，并切换“查询记录/提醒通知”两个面板。

  <div class="meter-detail-mask" id="meterDetailMask" hidden>

        <div id="meterDetailNotifyPanel" hidden></div>

  <!--
    离线示例脚本。
    它不负责读取云端或本地快照，而是用固定数据演示看板布局、分页和弹窗交互。
    使用真实快照时，由生成后的页面改为加载 scripts/dashboard-runtime.js。
  -->
  <script>
    // 示例看板对象：字段形状与快照转换后的 dashboard 对象保持相近。
    const dashboard = {
      kpis: [
        { label: '用户数量', value: '8', foot: '已绑定账号' },
        { label: '电表总数量', value: '16', foot: '当前纳管' },
        { label: '今日查询总次数', value: '128', foot: '含手动与定时' },
        { label: '今日规划任务数量', value: '42', foot: '待执行排程' },
        { label: '规划任务完成率', value: '86%', foot: '今日完成情况' },
        { label: '今日发送提醒', value: '17', foot: '邮件通知' },
        { label: '异常数量', value: '3', foot: '需要优先处理' },
      ],
      summary: [
        { key: 'normal', title: '正常状态', count: 8, note: '运行稳定，按默认节奏巡检' },
        { key: 'warn', title: '预警状态', count: 3, note: '接近阈值，建议观察' },
        { key: 'monitor', title: '待检查', count: 2, note: '已进入观察窗口' },
        { key: 'error', title: '异常状态', count: 3, note: '优先处理与回溯' },
      ],
      meters: [
        { id: '21-4-412', type: '照明', current: '18.4 kWh', daily: '2.1 kWh', fail: 0, next: '2026-09-04 13:20', state: 'normal', statusText: '正常', isColdStart: true },
        { id: '21-4-405', type: '空调', current: '24.0 kWh', daily: '3.8 kWh', fail: 1, next: '2026-09-04 13:40', state: 'normal', statusText: '正常', isColdStart: false },
        { id: '20-3-316', type: '照明', current: '16.7 kWh', daily: '4.5 kWh', fail: 0, next: '2026-09-04 14:10', state: 'normal', statusText: '正常' },
        { id: '20-4-423', type: '空调', current: '21.8 kWh', daily: '6.2 kWh', fail: 0, next: '2026-09-04 14:25', state: 'normal', statusText: '正常' },
        { id: '21-2-212', type: '照明', current: '14.9 kWh', daily: '7.4 kWh', fail: 1, next: '2026-09-04 12:55', state: 'normal', statusText: '正常' },
        { id: '21-3-329', type: '空调', current: '20.6 kWh', daily: '5.6 kWh', fail: 0, next: '2026-09-04 13:05', state: 'normal', statusText: '正常' },
        { id: '20-2-223', type: '照明', current: '17.8 kWh', daily: '4.0 kWh', fail: 0, next: '2026-09-04 13:15', state: 'normal', statusText: '正常' },
        { id: '21-1-107', type: '空调', current: '22.3 kWh', daily: '6.8 kWh', fail: 1, next: '2026-09-04 13:50', state: 'normal', statusText: '正常' },
        { id: '21-4-421', type: '照明', current: '12.5 kWh', daily: '8.9 kWh', fail: 1, next: '2026-09-04 11:40', state: 'warn', statusText: '预警' },
        { id: '20-4-412', type: '空调', current: '11.8 kWh', daily: '9.4 kWh', fail: 2, next: '2026-09-04 11:55', state: 'warn', statusText: '预警' },
        { id: '21-2-230', type: '照明', current: '10.9 kWh', daily: '10.1 kWh', fail: 1, next: '2026-09-04 12:05', state: 'warn', statusText: '预警' },
        { id: '20-3-320', type: '空调', current: '9.6 kWh', daily: '5.1 kWh', fail: 0, next: '2026-09-04 12:20', state: 'monitor', statusText: '待检查' },
        { id: '21-4-430', type: '照明', current: '13.3 kWh', daily: '4.8 kWh', fail: 0, next: '2026-09-04 12:35', state: 'monitor', statusText: '待检查' },
        { id: '20-4-416', type: '空调', current: '8.1 kWh', daily: '12.6 kWh', fail: 3, next: '2026-09-04 11:20', state: 'error', statusText: '异常' },
        { id: '21-1-123', type: '照明', current: '7.4 kWh', daily: '13.2 kWh', fail: 4, next: '2026-09-04 11:05', state: 'error', statusText: '异常' },
        { id: '21-3-316', type: '空调', current: '6.9 kWh', daily: '11.7 kWh', fail: 5, next: '2026-09-04 10:50', state: 'error', statusText: '异常' },
      ],
      mails: [
        { meter: '43791', type: '空调', remain: '5 / 20 kWh', status: 'sent', channel: 'email', time: '2026-09-03 00:05:07' },
        { meter: '20-4-412', type: '空调', remain: '11.8 / 20 kWh', status: 'failed', channel: 'email', time: '2026-09-04 11:50:11' },
        { meter: '21-2-230', type: '照明', remain: '10.9 / 20 kWh', status: 'sent', channel: 'email', time: '2026-09-04 11:54:08' },
        { meter: '20-3-320', type: '空调', remain: '9.6 / 20 kWh', status: 'pending', channel: 'email', time: '2026-09-04 12:03:21' },
        { meter: '21-1-123', type: '照明', remain: '7.4 / 20 kWh', status: 'skipped', channel: 'email', time: '2026-09-04 12:16:39' },
        { meter: '21-3-316', type: '空调', remain: '6.9 / 20 kWh', status: 'sent', channel: 'email', time: '2026-09-04 12:21:18' },
      ],
    };

    // 缓存模板中的 DOM 节点，后续渲染函数通过这些引用更新页面。
    const kpiGrid = document.getElementById('kpiGrid');
    const summaryGrid = document.getElementById('summaryGrid');
    const meterMatrix = document.getElementById('meterMatrix');
    const meterGrid = document.getElementById('meterGrid');
    const meterPageMeta = document.getElementById('meterPageMeta');
    const meterPrev = document.getElementById('meterPrev');
    const meterNext = document.getElementById('meterNext');
    const mailTable = document.getElementById('mailTable');
    const meterDetailMask = document.getElementById('meterDetailMask');
    const meterDetailTitle = document.getElementById('meterDetailTitle');
    const meterDetailSubtitle = document.getElementById('meterDetailSubtitle');
    const meterDetailSummary = document.getElementById('meterDetailSummary');
    const meterDetailQueryTab = document.getElementById('meterDetailQueryTab');
    const meterDetailNotifyTab = document.getElementById('meterDetailNotifyTab');
    const meterDetailQueryPanel = document.getElementById('meterDetailQueryPanel');
    const meterDetailNotifyPanel = document.getElementById('meterDetailNotifyPanel');
    const meterDetailClose = document.getElementById('meterDetailClose');

    // 将通知状态和渠道的英文枚举值转换成中文。
    const mailStatusLabel = {
      sent: '已发送',
      failed: '发送失败',
      pending: '待发送',
      skipped: '已跳过',
    };

    const mailChannelLabel = {
      email: '邮件',
    };

    // 异常优先级最高，正常状态最低；排序后的结果用于矩阵和卡片显示。
    const meterOrder = {
      error: 0,
      warn: 1,
      monitor: 2,
      normal: 3,
    };

    const pagerState = {
      page: 1,
      pageSize: 100,
    };

    // 补齐两位数字，供示例日期格式化使用。
    function pad2(value) {
      return String(value).padStart(2, '0');
    }

    function formatDate(date) {
      return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
    }

    // 将时间文本转为毫秒时间戳，方便按新旧排序。
    function parseDetailTime(value) {
      return new Date(String(value).replace(' ', 'T')).getTime();
    }

    function formatDetailTime(value) {
      if (!value) {
        return '-';
      }
      const date = new Date(String(value).replace(' ', 'T'));
      if (Number.isNaN(date.getTime())) {
        return String(value);
      }
      return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())} ${pad2(date.getHours())}:${pad2(date.getMinutes())}:${pad2(date.getSeconds())}`;
    }

    function getColdStartText(item) {
      if (item.isColdStart === true) {
        return '冷启动';
      }
      if (item.isColdStart === false) {
        return '稳定阶段';
      }
      return '阶段未知';
    }

    function renderColdStartBadge(item) {
      return item.isColdStart === true ? '<span class="cold-start-badge">冷启动</span>' : '';
    }

    // 为离线演示数据生成三条查询记录；这只是预览用的模拟数据，不会写入数据库。
    function buildMeterQueryRecords(item) {
      const current = Number.parseFloat(item.current);
      const daily = Number.parseFloat(item.daily);
      const baseTime = parseDetailTime(item.next) - 30 * 60 * 1000;
      const records = [0, 1, 2].map((index) => ({
        queriedAt: formatDetailTime(new Date(baseTime - index * 6 * 60 * 60 * 1000).toISOString()),
        remainingKwh: Math.max(0, current - daily * index * 0.25).toFixed(1),
        cutoffTime: `截止 ${formatDate(new Date(baseTime - index * 6 * 60 * 60 * 1000))}`,
        address: item.id,
        ok: index !== 2 || item.fail < 3,
        source: index === 0 ? 'scheduledCheck' : 'queryPower',
      }));

      if (item.fail > 0) {
        records[2].error = '示例查询失败记录';
      }
      return records;
    }

    // 根据记录类型生成查询记录或通知记录的 HTML。
    // map() 把每条记录转换为一段 HTML，join('') 再将数组拼成一个字符串。
    function renderMeterDetailRecords(records, kind) {
      if (!records.length) {
        return '<div class="meter-detail-empty">当前电表没有相关记录。</div>';
      }

      return `
        <div class="meter-detail-record-list">
          ${records.map((record) => {
            if (kind === 'query') {
              return `
                <article class="meter-detail-record ${record.ok ? '' : 'failed'}">
                  <div>
                    <div class="meter-detail-record-label">查询时间</div>
                    <div class="meter-detail-record-value">${record.queriedAt}</div>
                  </div>
                  <div>
                    <div class="meter-detail-record-label">剩余电量</div>
                    <div class="meter-detail-record-value">${record.remainingKwh} kWh</div>
                  </div>
                  <div>
                    <div class="meter-detail-record-label">结果</div>
                    <div class="meter-detail-record-value"><span class="tag ${record.ok ? 'sent' : 'failed'}">${record.ok ? '成功' : '失败'}</span></div>
                  </div>
                  <div>
                    <div class="meter-detail-record-label">详情</div>
                    <div class="meter-detail-record-note">来源：${record.source} · 截止：${record.cutoffTime} · 地址：${record.address}${record.error ? ` · 错误：${record.error}` : ''}</div>
                  </div>
                </article>
              `;
            }

            return `
              <article class="meter-detail-record ${record.status === 'failed' ? 'failed' : ''}">
                <div>
                  <div class="meter-detail-record-label">发送时间</div>
                  <div class="meter-detail-record-value">${formatDetailTime(record.time)}</div>
                </div>
                <div>
                  <div class="meter-detail-record-label">余量/阈值</div>
                  <div class="meter-detail-record-value">${record.remain}</div>
                </div>
                <div>
                  <div class="meter-detail-record-label">状态</div>
                  <div class="meter-detail-record-value"><span class="tag ${record.status}">${mailStatusLabel[record.status] ?? record.status}</span></div>
                </div>
                <div>
                  <div class="meter-detail-record-label">详情</div>
                  <div class="meter-detail-record-note">渠道：${mailChannelLabel[record.channel] ?? record.channel} · 示例通知明细</div>
                </div>
              </article>
            `;
          }).join('')}
        </div>
      `;
    }

    // 切换弹窗页签：active class 控制按钮样式，hidden 控制面板可见性。
    function setMeterDetailTab(tab) {
      meterDetailQueryTab.classList.toggle('active', tab === 'query');
      meterDetailNotifyTab.classList.toggle('active', tab === 'notify');
      meterDetailQueryPanel.hidden = tab !== 'query';
      meterDetailNotifyPanel.hidden = tab !== 'notify';
    }

    // 打开某台电表的离线示例详情，并从 dashboard.mails 中筛选其通知记录。
    function openMeterDetail(item) {
      const queryRecords = buildMeterQueryRecords(item)
        .sort((left, right) => parseDetailTime(right.queriedAt) - parseDetailTime(left.queriedAt));
      const notifyRecords = dashboard.mails
        .filter((mail) => mail.meter === item.id)
        .sort((left, right) => parseDetailTime(right.time) - parseDetailTime(left.time));

      meterDetailTitle.textContent = `${item.id} · ${item.type}`;
      meterDetailSubtitle.textContent = `当前状态：${item.statusText}，估算阶段：${getColdStartText(item)}，查询记录 ${queryRecords.length} 条，提醒记录 ${notifyRecords.length} 条。`;
      meterDetailSummary.innerHTML = `
        <div class="meter-detail-summary-item">
          <div class="meter-detail-summary-label">当前电量</div>
          <div class="meter-detail-summary-value">${item.current}</div>
        </div>
        <div class="meter-detail-summary-item">
          <div class="meter-detail-summary-label">日耗</div>
          <div class="meter-detail-summary-value">${item.daily}</div>
        </div>
        <div class="meter-detail-summary-item">
          <div class="meter-detail-summary-label">失败次数</div>
          <div class="meter-detail-summary-value">${item.fail} 次</div>
        </div>
        <div class="meter-detail-summary-item">
          <div class="meter-detail-summary-label">下次检查时间</div>
          <div class="meter-detail-summary-value">${item.next}</div>
        </div>
        <div class="meter-detail-summary-item">
          <div class="meter-detail-summary-label">估算阶段</div>
          <div class="meter-detail-summary-value">${getColdStartText(item)}</div>
        </div>
      `;
      meterDetailQueryPanel.innerHTML = renderMeterDetailRecords(queryRecords, 'query');
      meterDetailNotifyPanel.innerHTML = renderMeterDetailRecords(notifyRecords, 'notify');
      setMeterDetailTab('query');
      meterDetailMask.hidden = false;
    }

    // 通过 hidden 属性关闭弹窗。
    function closeMeterDetail() {
      meterDetailMask.hidden = true;
    }

    // 为演示密集看板效果，把少量示例电表扩展成 120 台模拟电表。
    // 这里使用 Array.from 和展开运算符复制基础对象，不改变原始 source 项。
    function expandMeters(source, total) {
      const states = ['error', 'warn', 'monitor', 'normal', 'normal', 'normal', 'normal'];
      const statusText = {
        normal: '正常',
        warn: '预警',
        monitor: '待检查',
        error: '异常',
      };

      return Array.from({ length: total }, (_, index) => {
        const base = source[index % source.length];
        const state = index < source.length ? base.state : states[(index + Math.floor(index / 9)) % states.length];
        const building = 20 + (index % 3);
        const floor = 1 + (index % 4);
        const room = 101 + ((index * 7) % 36);
        const current = state === 'error'
          ? (5.6 + (index % 8) * 0.5)
          : state === 'warn'
            ? (10.2 + (index % 8) * 0.7)
            : state === 'monitor'
              ? (13.0 + (index % 7) * 0.8)
              : (17.0 + (index % 10) * 0.9);
        const daily = state === 'error'
          ? (10.8 + (index % 6) * 0.6)
          : state === 'warn'
            ? (7.8 + (index % 6) * 0.5)
            : state === 'monitor'
              ? (4.6 + (index % 5) * 0.4)
              : (2.2 + (index % 8) * 0.5);

        return {
          ...base,
          id: index < source.length ? base.id : `${building}-${floor}-${room}`,
          type: index % 2 === 0 ? '空调' : '照明',
          current: `${current.toFixed(1)} kWh`,
          daily: `${daily.toFixed(1)} kWh`,
          fail: state === 'error' ? 3 + (index % 4) : state === 'warn' ? index % 3 : 0,
          next: `2026-09-04 ${pad2(10 + (index % 8))}:${pad2((index * 5) % 60)}`,
          state,
          statusText: statusText[state],
        };
      });
    }

    // 根据电表列表重新计算顶部总数和四类状态摘要。
    function updateOverviewData() {
      const counts = dashboard.meters.reduce((result, item) => {
        result[item.state] += 1;
        return result;
      }, { normal: 0, warn: 0, monitor: 0, error: 0 });

      dashboard.kpis = dashboard.kpis.map((item) => {
        if (item.label === '电表总数量') {
          return { ...item, value: String(dashboard.meters.length) };
        }
        if (item.label === '异常数量') {
          return { ...item, value: String(counts.error) };
        }
        return item;
      });

      dashboard.summary = dashboard.summary.map((item) => ({
        ...item,
        count: counts[item.key],
      }));
    }

    dashboard.meters = expandMeters(dashboard.meters, 120);
    updateOverviewData();

    // 生成矩阵所需的轻量字段，避免把整条对象都传给矩阵渲染逻辑。
    function buildHeatmapSeries() {
      return sortedMeters.map((item) => ({
        id: item.id,
        state: item.state,
        statusText: item.statusText,
        type: item.type,
        current: item.current,
        daily: item.daily,
        fail: item.fail,
        next: item.next,
      }));
    }

    // slice() 复制数组后再排序，避免改变 dashboard.meters 的原顺序。
    const sortedMeters = dashboard.meters.slice().sort((left, right) => {
      const stateDiff = meterOrder[left.state] - meterOrder[right.state];
      if (stateDiff !== 0) {
        return stateDiff;
      }
      return left.next.localeCompare(right.next);
    });

    // 用状态色块绘制密集矩阵；悬停 title 展示单台电表的简要信息。
    function renderMeterMatrix() {
      meterMatrix.innerHTML = buildHeatmapSeries().map((item) => {
        const title = `${item.id} · ${item.type} · ${item.statusText} · 当前电量 ${item.current}`;
        return `
          <span class="meter-tile ${item.state}" title="${title}" aria-label="${title}"></span>
        `;
      }).join('');
    }

    // 绘制当前页电表卡片，并更新分页信息和按钮禁用状态。
    function renderMeterCards() {
      const totalPages = Math.max(1, Math.ceil(sortedMeters.length / pagerState.pageSize));
      pagerState.page = Math.min(Math.max(pagerState.page, 1), totalPages);
      const start = (pagerState.page - 1) * pagerState.pageSize;
      const pageRows = sortedMeters.slice(start, start + pagerState.pageSize);

      meterGrid.innerHTML = pageRows.map((item) => `
        <article class="meter-card ${item.state}" role="button" tabindex="0" data-meter-id="${item.id}" aria-label="${item.id} 电表详情">
          <div class="meter-head">
            <div>
              <div class="meter-id">${item.id}</div>
              <div class="meter-type">类型：${item.type}</div>
            </div>
            <div class="meter-head-badges">
              ${renderColdStartBadge(item)}
              <span class="status-pill ${item.state}">${item.statusText}</span>
            </div>
          </div>
          <div class="meter-stats">
            <div class="stat">
              <div class="stat-label">当前电量</div>
              <div class="stat-value">${item.current}</div>
            </div>
            <div class="stat">
              <div class="stat-label">日耗</div>
              <div class="stat-value">${item.daily}</div>
            </div>
            <div class="stat">
              <div class="stat-label">失败次数</div>
              <div class="stat-value">${item.fail} 次</div>
            </div>
            <div class="stat">
              <div class="stat-label">下次检查时间</div>
              <div class="stat-value">${item.next}</div>
            </div>
          </div>
        </article>
      `).join('');

      meterPageMeta.textContent = `共 ${sortedMeters.length} 台 · 第 ${pagerState.page} / ${totalPages} 页 · 每页 ${pagerState.pageSize} 条`;
      meterPrev.disabled = pagerState.page <= 1;
      meterNext.disabled = pagerState.page >= totalPages;
    }

    // 首次把 KPI 和状态摘要写入页面。
    kpiGrid.innerHTML = dashboard.kpis.map((item) => `
      <div class="kpi">
        <div class="kpi-label">${item.label}</div>
        <div class="kpi-value">${item.value}</div>
        <div class="kpi-foot">${item.foot}</div>
      </div>
    `).join('');

    summaryGrid.innerHTML = dashboard.summary.map((item) => `
      <div class="summary-card ${item.key}">
        <h3>${item.title}</h3>
        <div class="count">${item.count}</div>
        <div class="note">${item.note}</div>
      </div>
    `).join('');

    // 首次绘制电表矩阵和卡片。
    renderMeterMatrix();
    renderMeterCards();

    // 分页按钮只修改页码，然后重新绘制卡片。
    meterPrev.addEventListener('click', () => {
      if (pagerState.page > 1) {
        pagerState.page -= 1;
        renderMeterCards();
      }
    });

    meterNext.addEventListener('click', () => {
      const totalPages = Math.max(1, Math.ceil(sortedMeters.length / pagerState.pageSize));
      if (pagerState.page < totalPages) {
        pagerState.page += 1;
        renderMeterCards();
      }
    });

    // 电表卡片使用事件委托：容器只绑定一次，点击具体卡片时再根据 data-meter-id 查找数据。
    meterGrid.addEventListener('click', (event) => {
      const card = event.target.closest('.meter-card');
      if (!card) {
        return;
      }
      const item = sortedMeters.find((meter) => meter.id === card.dataset.meterId);
      if (item) {
        openMeterDetail(item);
      }
    });

    // 键盘 Enter/空格与鼠标点击执行相同操作，保证 role="button" 卡片可访问。
    meterGrid.addEventListener('keydown', (event) => {
      if ((event.key === 'Enter' || event.key === ' ') && event.target.classList.contains('meter-card')) {
        event.preventDefault();
        const item = sortedMeters.find((meter) => meter.id === event.target.dataset.meterId);
        if (item) {
          openMeterDetail(item);
        }
      }
    });

    // 详情弹窗支持关闭按钮、点击遮罩、页签切换和 Escape 键关闭。
    meterDetailClose.addEventListener('click', closeMeterDetail);
    meterDetailMask.addEventListener('click', (event) => {
      if (event.target === meterDetailMask) {
        closeMeterDetail();
      }
    });
    meterDetailQueryTab.addEventListener('click', () => setMeterDetailTab('query'));
    meterDetailNotifyTab.addEventListener('click', () => setMeterDetailTab('notify'));
    document.addEventListener('keydown', (event) => {
      if (!meterDetailMask.hidden && event.key === 'Escape') {
        closeMeterDetail();
      }
    });

    // 首次填充通知表格；示例数据不经过真实快照运行时的安全转义流程。
    mailTable.innerHTML = dashboard.mails.map((item) => `
      <tr>
        <td class="table-meter">${item.meter}</td>
        <td>${item.type}</td>
        <td>${item.remain}</td>
        <td><span class="tag ${item.status}">${mailStatusLabel[item.status] ?? item.status}</span></td>
        <td>${mailChannelLabel[item.channel] ?? item.channel}</td>
        <td class="table-time">${item.time}</td>
      </tr>
    `).join('');
  </script>
</body>
</html>
